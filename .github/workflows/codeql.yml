# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** HOW TO CONFIG THE CODEQL MINIMAL WORKFLOW ********
#
# To use CodeQL, you must define the languages to analyze in the matrix below.
# CodeQL supports the following languages:
# 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'swift'.
#
# 1. Customize the 'language' matrix below to specify the languages to analyze.
# 2. Modify the 'queries' input to specify additional CodeQL queries to run.
# 3. Override the default 'build-mode' if necessary (default is 'autobuild').
#
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: false # Disabled to prevent conflict with GitHub default setup
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (matrix.language == 'swift' && 120) || 360 }}
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4.1.7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@5ba2889ada762081db2c4f32a729827dce632c7b # v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@5ba2889ada762081db2c4f32a729827dce632c7b # v3
      with:
        category: "/language:${{matrix.language}}"
